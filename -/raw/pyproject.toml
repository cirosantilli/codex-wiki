[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-wiki-figure-generators"
version = "0.0.0"
description = "Python environment for the Codex Wiki figure generators."
requires-python = ">=3.14,<3.15"
dependencies = [
  "matplotlib==3.10.7",
  "numpy==2.3.5",
]

[tool.setuptools]
py-modules = []
